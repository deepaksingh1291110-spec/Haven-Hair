<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="nositelinkssearchbox">
    <meta name="google" content="notranslate">
    <title>Haven Hair — Find a Barber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='customer/css/customer.css') }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#c8902a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HavenHair">
    <style>
        /* ---- Page-specific styles ---- */

        /* Search bar */
        .search-wrap {
            padding: 12px 16px;
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }
        .search-wrap input { margin: 0; flex: 1; }
        .search-btn {
            background: var(--amber);
            color: #0a0806;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0 16px;
            font-size: 0.82rem;
            font-weight: 500;
            font-family: var(--font-body);
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
            transition: background var(--ease);
        }
        .search-btn:hover { background: var(--amber-light); }

        /* Location bar */
        .loc-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            font-size: 0.78rem;
        }
        .loc-name { color: var(--amber); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .loc-radius {
        width: 65px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 8px;
            font-size: 0.72rem;
            font-family: var(--font-body);
            border-radius: var(--radius-sm);
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
        }
        .loc-gps {
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.72rem;
            flex-shrink: 0;
            transition: color var(--ease);
        }
        .loc-gps:hover { color: var(--amber); }

        /* Filter chips */
        .filters-wrap {
            display: flex;
            gap: 6px;
            padding: 10px 16px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .filters-wrap::-webkit-scrollbar { display: none; }

        .chip {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 0.72rem;
            font-weight: 500;
            font-family: var(--font-body);
            white-space: nowrap;
            cursor: pointer;
            transition: all var(--ease);
            flex-shrink: 0;
        }
        .chip:hover  { border-color: var(--amber-dim); color: var(--text); }
        .chip.active { background: var(--amber); border-color: var(--amber); color: #0a0806; font-weight: 600; }

        /* Results bar */
        .results-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
        }
        .results-count {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .results-count strong {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--amber);
        }
        .sort-select {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 5px 10px;
            font-size: 0.72rem;
            font-family: var(--font-body);
            border-radius: var(--radius-sm);
            outline: none;
            cursor: pointer;
            width: auto;
        }

        /* Shops list */
        .shops-list { padding: 0 14px 12px; }

        /* Home service badge on card */
        .home-svc-tag {
            font-size: 0.65rem;
            color: var(--amber);
            border: 1px solid var(--amber-dim);
            border-radius: 10px;
            padding: 2px 7px;
            margin-top: 4px;
            display: inline-block;
        }

        /* Skeleton card */
        .skeleton-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 12px;
        }
        .skel-line {
            height: 12px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .skel-line.w-60 { width: 60%; }
        .skel-line.w-40 { width: 40%; }
        .skel-line.w-80 { width: 80%; }
        .skel-stats {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 6px;
            margin-top: 12px;
        }
        .skel-stat { height: 44px; border-radius: var(--radius-sm); }
    </style>
</head>
<body>

<!-- ======= HEADER ======= -->
<header class="app-header">
    <div class="header-logo">Haven<em>Hair</em></div>
    <div style="display:flex; align-items:center; gap:14px;">
        <!-- Message icon with unread badge -->
        <a href="/customer/messages" style="position:relative; font-size:1.2rem; color:var(--text-muted);">
            💬
            <span class="nav-badge" id="msg-badge"></span>
        </a>
        <!-- Profile icon -->
        <a href="/customer/profile" style="font-size:1.2rem; color:var(--text-muted);">👤</a>
    </div>
</header>

<!-- ======= MAIN CONTENT ======= -->
<main class="app-content page-enter">

    <!-- Search -->
    <div class="search-wrap">
        <input type="text" id="search-input"
               placeholder="Shop name or area..."
               oninput="onSearchInput(this.value)">
        <button class="search-btn" onclick="searchByArea()">Search</button>
    </div>

    <!-- Location bar -->
    <div class="loc-bar">
        <span>📍</span>
        <span class="loc-name" id="loc-name">Detecting location...</span>
        <select class="loc-radius" id="radius-sel" onchange="loadShops()">
            <option value="5">5 km</option>
            <option value="10" selected>10 km</option>
            <option value="20">20 km</option>
            <option value="50">50 km</option>
            <option value="999">All areas</option>
        </select>
        <span class="loc-gps" onclick="getLocation()">📡 Locate me</span>
    </div>

    <!-- Filter chips -->
    <div class="filters-wrap">
        <button class="chip active" data-filter="all"          onclick="setFilter('all', this)">All</button>
        <button class="chip"        data-filter="open"         onclick="setFilter('open', this)">🟢 Open Now</button>
        <button class="chip"        data-filter="top"          onclick="setFilter('top', this)">🏅 Top Rated</button>
        <button class="chip"        data-filter="trusted"      onclick="setFilter('trusted', this)">✓ Trusted</button>
        <button class="chip"        data-filter="home_service" onclick="setFilter('home_service', this)">🏠 Home Service</button>
    </div>

    <!-- Results count + sort -->
    <div class="results-bar">
        <div class="results-count" id="results-count"></div>
        <select class="sort-select" id="sort-sel" onchange="applyFilters()">
            <option value="distance">Nearest first</option>
            <option value="rating">Top rated</option>
            <option value="queue">Shortest queue</option>
        </select>
    </div>

    <!-- Shop cards -->
    <div class="shops-list" id="shops-list">
        <!-- Skeleton loading state -->
        <div id="skeleton-loader">
            <div class="skeleton-card">
                <div class="skel-line w-60 skeleton"></div>
                <div class="skel-line w-40 skeleton"></div>
                <div class="skel-stats">
                    <div class="skel-stat skeleton"></div>
                    <div class="skel-stat skeleton"></div>
                    <div class="skel-stat skeleton"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skel-line w-80 skeleton"></div>
                <div class="skel-line w-60 skeleton"></div>
                <div class="skel-stats">
                    <div class="skel-stat skeleton"></div>
                    <div class="skel-stat skeleton"></div>
                    <div class="skel-stat skeleton"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skel-line w-50 skeleton" style="width:50%"></div>
                <div class="skel-line w-40 skeleton"></div>
                <div class="skel-stats">
                    <div class="skel-stat skeleton"></div>
                    <div class="skel-stat skeleton"></div>
                    <div class="skel-stat skeleton"></div>
                </div>
            </div>
        </div>
    </div>

</main>

<!-- ======= BOTTOM NAV ======= -->
<nav class="bottom-nav">
    <a class="nav-item active" onclick="sessionStorage.removeItem('hh_left_shops'); window.location.replace('/customer/shops')">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">Explore</span>
    </a>
    <a class="nav-item" id="nav-queue" onclick="navTo('/customer/queue')">
        <span class="nav-icon">🪙</span>
        <span class="nav-label">My Queue</span>
    </a>
    <a class="nav-item" onclick="navTo('/customer/messages')">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Messages</span>
        <span class="nav-badge" id="nav-msg-badge"></span>
    </a>
    <a class="nav-item" onclick="navTo('/customer/profile')">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Profile</span>
    </a>
</nav>

<!-- ======= SCRIPTS ======= -->
<!-- ======= SCRIPTS ======= -->
<script src="{{ url_for('static', filename='customer/js/shared.js') }}"></script>
<script src="{{ url_for('static', filename='customer/js/shops.js') }}"></script>
</body>
</html>
